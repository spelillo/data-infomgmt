name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LibreOffice (for the .xlsx round-trip test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Install Playwright and Chromium (for the browser tests)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Engine, content and Excel tests
        run: node --test test/formula.test.js test/workbook.test.js test/pivot.test.js test/query.test.js test/grader.test.js test/xlsx.test.js test/content.test.js test/libreoffice.test.js

      - name: Browser tests
        run: npm run test:e2e
